<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-Frame-Options" content="ALLOWALL">
<meta http-equiv="Content-Security-Policy" content="frame-ancestors *">
<title>Selenarium · Currently</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Josefin+Sans:wght@100;200;300;400&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #191919;
    color: #e8dfc8;
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    padding: 24px 22px;
    position: relative;
    overflow: hidden;
  }
  .stars { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
  .star { position:absolute; background:white; border-radius:50%; animation:twinkle var(--d) ease-in-out infinite; animation-delay:var(--delay); }
  @keyframes twinkle { 0%,100%{opacity:var(--op)} 50%{opacity:calc(var(--op)*0.15)} }

  .widget { position:relative; z-index:1; }

  .widget-title {
    font-size: 9px;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: #6b6585;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .widget-title::before { content:'◉'; font-size:10px; color:#8b7fd4; }
  .widget-title::after { content:''; flex:1; height:1px; background:rgba(139,127,212,0.15); }

  .item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    cursor: pointer;
    transition: background 0.2s;
    border-radius: 6px;
    padding-left: 6px;
    padding-right: 6px;
  }
  .item:last-child { border-bottom: none; }
  .item:hover { background: rgba(139,127,212,0.05); }

  .item-icon {
    font-size: 20px;
    width: 28px;
    text-align: center;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .item-body { flex: 1; min-width: 0; }

  .item-medium {
    font-size: 8px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #6b6585;
    margin-bottom: 3px;
  }

  .item-title-row {
    display: flex;
    align-items: baseline;
    gap: 0;
    flex-wrap: wrap;
  }

  .item-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    font-weight: 300;
    color: #ddd8f0;
    letter-spacing: 0.03em;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  .item-creator {
    font-size: 10px;
    color: #6b6585;
    letter-spacing: 0.1em;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .item-status {
    font-size: 9px;
    letter-spacing: 0.15em;
    color: #8b7fd4;
    margin-top: 3px;
  }

  /* Edit mode */
  .edit-panel {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(13,13,20,0.92);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .edit-panel.open { display: flex; }
  .edit-card {
    background: #1e1e2e;
    border: 1px solid rgba(139,127,212,0.2);
    border-radius: 12px;
    padding: 22px;
    width: 100%;
    max-width: 300px;
  }
  .edit-title {
    font-size: 9px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: #8b7fd4;
    margin-bottom: 16px;
  }
  .edit-field {
    margin-bottom: 12px;
  }
  .edit-label {
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #6b6585;
    display: block;
    margin-bottom: 5px;
  }
  .edit-input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(139,127,212,0.15);
    border-radius: 6px;
    padding: 7px 10px;
    color: #ddd8f0;
    font-family: 'Josefin Sans', sans-serif;
    font-size: 12px;
    letter-spacing: 0.05em;
    outline: none;
  }
  .edit-input:focus { border-color: rgba(139,127,212,0.4); }
  .edit-buttons { display:flex; gap:8px; margin-top:16px; }
  .btn {
    flex: 1;
    padding: 8px;
    border-radius: 6px;
    font-family: 'Josefin Sans', sans-serif;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
  }
  .btn-save { background: #8b7fd4; color: #fff; }
  .btn-save:hover { background: #7a6ec3; }
  .btn-cancel { background: rgba(255,255,255,0.06); color: #a09ab8; }
  .btn-cancel:hover { background: rgba(255,255,255,0.1); }
  .edit-hint {
    font-size: 9px;
    letter-spacing: 0.2em;
    color: #6b6585;
    text-align: center;
    margin-top: 14px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="widget">
  <div class="widget-title">Currently</div>
  <div id="itemList"></div>
  <div class="edit-hint">✦ tap any row to edit ✦</div>
</div>

<div class="edit-panel" id="editPanel">
  <div class="edit-card">
    <div class="edit-title" id="editTitle">Edit Entry</div>
    <div class="edit-field">
      <label class="edit-label">Title</label>
      <input class="edit-input" id="editName" type="text">
    </div>
    <div class="edit-field">
      <label class="edit-label">Creator / Artist / Author</label>
      <input class="edit-input" id="editCreator" type="text">
    </div>
    <div class="edit-field">
      <label class="edit-label">Status / Progress</label>
      <input class="edit-input" id="editStatus" type="text" placeholder="e.g. Ch. 8, S2 Ep 4, On rotation...">
    </div>
    <div class="edit-buttons">
      <button class="btn btn-cancel" onclick="closeEdit()">Cancel</button>
      <button class="btn btn-save" onclick="saveEdit()">Save ✦</button>
    </div>
  </div>
</div>

<script>
// Starfield
const starsEl = document.getElementById('stars');
for (let i = 0; i < 80; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const sz = Math.random() * 1.6 + 0.3;
  s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:${Math.random()*6}s;--op:${0.15+Math.random()*0.4};`;
  starsEl.appendChild(s);
}

const DEFAULTS = [
  { medium: 'Reading',   icon: '📚', name: 'The Left Hand of Darkness', creator: 'Ursula K. Le Guin', status: 'Ch. 8 · in progress' },
  { medium: 'Listening', icon: '🎵', name: 'folklure',                  creator: 'Florist',            status: 'On rotation' },
  { medium: 'Watching',  icon: '🎞', name: 'Slow Horses',               creator: 'Apple TV+',          status: 'S4 · Ep 4' },
  { medium: 'Writing',   icon: '✍️', name: 'The Hollow Hours',          creator: '—',                  status: 'Ch. 12 · first draft' },
  { medium: 'Learning',  icon: '🎓', name: 'Mycology: The Kingdom Fungi',creator: 'Self-directed',      status: 'Module 2 / 6' },
];

function load() {
  try {
    const saved = localStorage.getItem('selenarium-currently');
    return saved ? JSON.parse(saved) : DEFAULTS;
  } catch(e) { return DEFAULTS; }
}

function save(data) {
  try { localStorage.setItem('selenarium-currently', JSON.stringify(data)); } catch(e) {}
}

let data = load();
let editIdx = null;

function render() {
  const list = document.getElementById('itemList');
  list.innerHTML = '';
  data.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `
      <div class="item-icon">${item.icon}</div>
      <div class="item-body">
        <div class="item-medium">${item.medium}</div>
        <div class="item-title">${item.name}</div>
        <div class="item-creator">${item.creator}</div>
        <div class="item-status">${item.status}</div>
      </div>`;
    el.onclick = () => openEdit(i);
    list.appendChild(el);
  });
}

function openEdit(i) {
  editIdx = i;
  const item = data[i];
  document.getElementById('editTitle').textContent = `Edit · ${item.medium}`;
  document.getElementById('editName').value = item.name;
  document.getElementById('editCreator').value = item.creator;
  document.getElementById('editStatus').value = item.status;
  document.getElementById('editPanel').classList.add('open');
}

function closeEdit() {
  document.getElementById('editPanel').classList.remove('open');
  editIdx = null;
}

function saveEdit() {
  if (editIdx === null) return;
  data[editIdx].name    = document.getElementById('editName').value.trim() || data[editIdx].name;
  data[editIdx].creator = document.getElementById('editCreator').value.trim();
  data[editIdx].status  = document.getElementById('editStatus').value.trim();
  save(data);
  render();
  closeEdit();
}

document.getElementById('editPanel').addEventListener('click', function(e) {
  if (e.target === this) closeEdit();
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeEdit(); });

render();
</script>
</body>
</html>
