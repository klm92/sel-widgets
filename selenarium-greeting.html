<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selenarium Greeting</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Josefin+Sans:wght@100;200;300;400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    color: #e8dfc8;
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 300;
    padding: 20px 24px;
    min-height: 100vh;
    display: flex;
    align-items: center;
  }

  .wrap {
    width: 100%;
  }

  .greeting {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 0.08em;
    color: #e8dfc8;
    line-height: 1.2;
  }

  .date-line {
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #6b6585;
    margin-top: 6px;
  }

  .lunar-line {
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #8b7fd4;
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .progress-section {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .progress-label {
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #6b6585;
    min-width: 90px;
  }

  .bar-track {
    flex: 1;
    height: 2px;
    background: rgba(255,255,255,0.07);
    border-radius: 2px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 2px;
  }

  .bar-pct {
    font-size: 9px;
    color: #6b6585;
    min-width: 30px;
    text-align: right;
    letter-spacing: 0.1em;
  }

  .stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: -1;
    overflow: hidden;
    background: #0d0d14;
  }

  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--d) ease-in-out infinite;
    animation-delay: var(--delay);
  }

  @keyframes twinkle {
    0%, 100% { opacity: var(--op); }
    50% { opacity: calc(var(--op) * 0.2); }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="wrap">
  <div class="greeting" id="greeting"></div>
  <div class="date-line" id="dateLine"></div>
  <div class="lunar-line" id="lunarLine"></div>

  <div class="progress-section">
    <div class="progress-row">
      <span class="progress-label">Year Progress</span>
      <div class="bar-track">
        <div class="bar-fill" id="yearBar" style="background:linear-gradient(90deg,#8b7fd4,#c9a84c);"></div>
      </div>
      <span class="bar-pct" id="yearPct"></span>
    </div>
    <div class="progress-row">
      <span class="progress-label">Lunar Cycle</span>
      <div class="bar-track">
        <div class="bar-fill" id="lunarBar" style="background:#8b7fd4;"></div>
      </div>
      <span class="bar-pct" id="lunarPct"></span>
    </div>
    <div class="progress-row">
      <span class="progress-label">Month Progress</span>
      <div class="bar-track">
        <div class="bar-fill" id="monthBar" style="background:#5ab4a0;"></div>
      </div>
      <span class="bar-pct" id="monthPct"></span>
    </div>
  </div>
</div>

<script>
  // ── Starfield ──────────────────────────────────────────────
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random() * 1.8 + 0.4;
    s.style.cssText = `
      width:${sz}px; height:${sz}px;
      top:${Math.random()*100}%; left:${Math.random()*100}%;
      --d:${2+Math.random()*4}s;
      --delay:${Math.random()*5}s;
      --op:${0.2+Math.random()*0.5};
    `;
    starsEl.appendChild(s);
  }

  // ── Lunar phase calculator ─────────────────────────────────
  // Returns { name, emoji, dayInCycle, pct }
  function getLunarPhase(date) {
    // Known new moon: Jan 29 2025 12:36 UTC
    const knownNewMoon = new Date(Date.UTC(2025, 0, 29, 12, 36, 0));
    const synodicMonth = 29.53058867; // days
    const msPerDay = 86400000;
    const daysSince = (date - knownNewMoon) / msPerDay;
    let dayInCycle = ((daysSince % synodicMonth) + synodicMonth) % synodicMonth;
    const pct = dayInCycle / synodicMonth;

    let name, emoji;
    if      (dayInCycle < 1.85)  { name = 'New Moon';        emoji = '🌑'; }
    else if (dayInCycle < 7.38)  { name = 'Waxing Crescent'; emoji = '🌒'; }
    else if (dayInCycle < 9.22)  { name = 'First Quarter';   emoji = '🌓'; }
    else if (dayInCycle < 14.77) { name = 'Waxing Gibbous';  emoji = '🌔'; }
    else if (dayInCycle < 16.61) { name = 'Full Moon';       emoji = '🌕'; }
    else if (dayInCycle < 22.15) { name = 'Waning Gibbous';  emoji = '🌖'; }
    else if (dayInCycle < 23.99) { name = 'Last Quarter';    emoji = '🌗'; }
    else if (dayInCycle < 29.53) { name = 'Waning Crescent'; emoji = '🌘'; }
    else                          { name = 'New Moon';        emoji = '🌑'; }

    return { name, emoji, dayInCycle: Math.floor(dayInCycle) + 1, pct };
  }

  // ── Main render ────────────────────────────────────────────
  function render() {
    const now   = new Date();
    const hour  = now.getHours();

    // Greeting
    let salutation;
    if      (hour >= 5  && hour < 12) salutation = 'Good morning';
    else if (hour >= 12 && hour < 17) salutation = 'Good afternoon';
    else if (hour >= 17 && hour < 21) salutation = 'Good evening';
    else                               salutation = 'Good night';
    document.getElementById('greeting').textContent = `${salutation}, stargazer ✦`;

    // Date line
    const days   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['January','February','March','April','May','June',
                    'July','August','September','October','November','December'];
    const dayName = days[now.getDay()];
    const monName = months[now.getMonth()];
    const date    = now.getDate();
    const year    = now.getFullYear();
    document.getElementById('dateLine').textContent =
      `${dayName}  ·  ${monName} ${date}, ${year}`;

    // Lunar phase
    const lunar = getLunarPhase(now);
    document.getElementById('lunarLine').textContent =
      `${lunar.emoji}  ${lunar.name}  ·  Day ${lunar.dayInCycle} of 29`;

    // Year progress
    const startOfYear = new Date(year, 0, 1);
    const startOfNext = new Date(year + 1, 0, 1);
    const yearPct = (now - startOfYear) / (startOfNext - startOfYear);
    document.getElementById('yearBar').style.width = (yearPct * 100).toFixed(1) + '%';
    document.getElementById('yearPct').textContent  = Math.round(yearPct * 100) + '%';

    // Lunar cycle progress
    document.getElementById('lunarBar').style.width  = (lunar.pct * 100).toFixed(1) + '%';
    document.getElementById('lunarPct').textContent  = Math.round(lunar.pct * 100) + '%';

    // Month progress
    const startOfMonth = new Date(year, now.getMonth(), 1);
    const startOfNextM = new Date(year, now.getMonth() + 1, 1);
    const monthPct = (now - startOfMonth) / (startOfNextM - startOfMonth);
    document.getElementById('monthBar').style.width = (monthPct * 100).toFixed(1) + '%';
    document.getElementById('monthPct').textContent  = Math.round(monthPct * 100) + '%';
  }

  render();
  // Re-render every minute so greeting updates if you leave the page open
  setInterval(render, 60000);
</script>
</body>
</html>
