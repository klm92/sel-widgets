<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-Frame-Options" content="ALLOWALL">
<meta http-equiv="Content-Security-Policy" content="frame-ancestors *">
<title>Selenarium · The Archive</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Cinzel:wght@400;500;600&family=Josefin+Sans:wght@100;200;300;400&family=IM+Fell+English:ital@0;1&display=swap');

:root {
  --bg:        #191919;
  --bg2:       #1e1e24;
  --bg3:       #22222c;
  --panel:     rgba(28, 28, 38, 0.85);
  --glass:     rgba(255,255,255,0.03);
  --border:    rgba(180,170,220,0.10);
  --border2:   rgba(180,170,220,0.22);
  --moon:      #e8e0d0;
  --moonsoft:  rgba(232,224,208,0.65);
  --silver:    #c8c0d8;
  --silversoft:rgba(200,192,216,0.5);
  --gold:      #c9a84c;
  --goldsoft:  rgba(201,168,76,0.25);
  --teal:      #4a9fa8;
  --tealsoft:  rgba(74,159,168,0.2);
  --indigo:    #6a7fc1;
  --indigosoft:rgba(106,127,193,0.2);
  --pearl:     #d8d0e8;
  --text:      #ccc8dc;
  --text2:     #8a8498;
  --text3:     #4a4860;

  /* Section accent colors */
  --noctuary:  #7a6fa8;
  --storyforge:#8a6a5a;
  --lantern:   #b07840;
  --prism:     #6a8ab0;
  --hearth:    #7a9070;
  --observatory:#5a7898;
  --athenaeum: #8a7a5a;
  --infirmary: #5a9888;
  --lexicon:   #7a6898;
  --reverie:   #9a6880;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Josefin Sans', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  padding: 32px 24px 40px;
  position: relative;
  overflow-x: hidden;
}

/* ─── STARFIELD ─────────────────────────────────────────── */
.starfield {
  position: fixed; top:0; left:0; width:100%; height:100%;
  pointer-events: none; z-index: 0; overflow: hidden;
}
.s {
  position: absolute; background: white; border-radius: 50%;
  animation: tw var(--d) ease-in-out infinite var(--dl);
}
@keyframes tw { 0%,100%{opacity:var(--op)} 50%{opacity:calc(var(--op)*0.1)} }

/* Atmospheric glow pools */
.glow-pool {
  position: fixed; border-radius: 50%;
  pointer-events: none; z-index: 0;
  filter: blur(80px); opacity: 0.06;
}

/* ─── LAYOUT ────────────────────────────────────────────── */
.wrapper { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; }

/* ─── HEADER ────────────────────────────────────────────── */
.archive-header {
  text-align: center;
  margin-bottom: 36px;
  position: relative;
}

.header-deco {
  display: flex; align-items: center; justify-content: center;
  gap: 12px; margin-bottom: 8px;
}
.deco-line {
  height: 1px; width: 60px;
  background: linear-gradient(90deg, transparent, var(--border2));
}
.deco-line.right { background: linear-gradient(90deg, var(--border2), transparent); }
.deco-glyph { font-size: 13px; color: var(--text3); letter-spacing: 0.3em; }

.archive-title {
  font-family: 'Cinzel', serif;
  font-size: 28px;
  font-weight: 400;
  letter-spacing: 0.22em;
  color: var(--moon);
  text-shadow: 0 0 40px rgba(232,224,208,0.2);
  line-height: 1;
  margin-bottom: 6px;
}

.archive-subtitle {
  font-family: 'IM Fell English', serif;
  font-size: 13px;
  font-style: italic;
  color: var(--text3);
  letter-spacing: 0.08em;
}

/* Ornate divider */
.ornate-divider {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; margin: 20px 0;
}
.ornate-line {
  height: 1px; flex: 1;
  background: linear-gradient(90deg, transparent, rgba(180,170,220,0.15), transparent);
}
.ornate-center {
  display: flex; align-items: center; gap: 6px;
  color: var(--text3); font-size: 10px; letter-spacing: 0.4em;
}
.ornate-diamond { color: var(--silversoft); font-size: 8px; }

/* ─── GRID ──────────────────────────────────────────────── */
.archive-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  grid-template-rows: auto auto;
  gap: 10px;
}

/* ─── SECTION CARD ──────────────────────────────────────── */
.section-card {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px 16px 18px;
  cursor: pointer;
  text-decoration: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 10px;
  overflow: hidden;
  transition: transform 0.3s cubic-bezier(0.23,1,0.32,1),
              border-color 0.3s ease,
              box-shadow 0.3s ease;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

/* Glass shimmer layer */
.section-card::before {
  content: '';
  position: absolute; top:0; left:0; right:0;
  height: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, transparent 100%);
  border-radius: 14px 14px 0 0;
  pointer-events: none;
}

/* Top accent bar */
.section-card::after {
  content: '';
  position: absolute; top:0; left: 20%; right: 20%;
  height: 1px;
  background: var(--accent-color, rgba(200,192,216,0.3));
  opacity: 0;
  transition: opacity 0.3s ease;
  border-radius: 1px;
}

.section-card:hover {
  transform: translateY(-3px);
  border-color: var(--border2);
  box-shadow:
    0 8px 32px rgba(0,0,0,0.4),
    0 0 20px var(--glow-color, rgba(139,127,212,0.08)),
    inset 0 1px 0 rgba(255,255,255,0.06);
}

.section-card:hover::after { opacity: 1; }

/* Individual accent per card on hover */
.section-card:hover .card-icon-wrap { box-shadow: 0 0 18px var(--glow-color, rgba(139,127,212,0.3)); }
.section-card:hover .card-title { color: var(--moon); }

/* ─── CARD ICON ─────────────────────────────────────────── */
.card-icon-wrap {
  width: 46px; height: 46px;
  border-radius: 50%;
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.03);
  flex-shrink: 0;
  transition: box-shadow 0.3s ease, border-color 0.3s ease;
  position: relative;
}

.card-icon-wrap svg {
  width: 22px; height: 22px;
  overflow: visible;
}

/* ─── CARD TEXT ─────────────────────────────────────────── */
.card-body { width: 100%; }

.card-title {
  font-family: 'Cinzel', serif;
  font-size: 10.5px;
  font-weight: 400;
  letter-spacing: 0.18em;
  color: var(--silver);
  margin-bottom: 5px;
  line-height: 1.3;
  transition: color 0.3s ease;
}

.card-the {
  font-family: 'IM Fell English', serif;
  font-size: 9px;
  font-style: italic;
  color: var(--text3);
  display: block;
  letter-spacing: 0.1em;
  margin-bottom: 1px;
}

.card-tagline {
  font-family: 'IM Fell English', serif;
  font-size: 9.5px;
  font-style: italic;
  color: var(--text3);
  line-height: 1.5;
  letter-spacing: 0.02em;
}

/* ─── LANTERN GLOW PARTICLES ────────────────────────────── */
.card-particle {
  position: absolute;
  border-radius: 50%;
  background: var(--glow-color, rgba(201,168,76,0.5));
  pointer-events: none;
  opacity: 0;
  animation: none;
}

.section-card:hover .card-particle {
  animation: float-particle var(--pd, 2s) ease-in-out infinite var(--pdl, 0s);
}

@keyframes float-particle {
  0% { opacity: 0; transform: translate(0, 0) scale(0); }
  30% { opacity: 0.6; }
  100% { opacity: 0; transform: translate(var(--px, 10px), var(--py, -30px)) scale(0.3); }
}

/* ─── CONSTELLATION BACKGROUND ──────────────────────────── */
.card-constellation {
  position: absolute; bottom: 0; right: 0;
  width: 60px; height: 60px;
  opacity: 0.07;
  pointer-events: none;
  transition: opacity 0.3s;
}
.section-card:hover .card-constellation { opacity: 0.18; }

/* ─── FOOTER ────────────────────────────────────────────── */
.archive-footer {
  text-align: center;
  margin-top: 32px;
}

.footer-text {
  font-family: 'IM Fell English', serif;
  font-size: 11px;
  font-style: italic;
  color: var(--text3);
  letter-spacing: 0.05em;
}

/* ─── RIPPLE ─────────────────────────────────────────────── */
.ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,0.04);
  transform: scale(0);
  animation: ripple 0.6s ease-out forwards;
  pointer-events: none;
}
@keyframes ripple { to { transform: scale(4); opacity: 0; } }

/* ─── TOOLTIP ────────────────────────────────────────────── */
.card-tooltip {
  position: absolute;
  bottom: calc(100% + 8px);
  left: 50%; transform: translateX(-50%);
  background: rgba(20,18,28,0.95);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--silversoft);
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s ease;
  z-index: 10;
  backdrop-filter: blur(8px);
}
.section-card:hover .card-tooltip { opacity: 1; }

</style>
</head>

// ── BUILD CARDS ──────────────────────────────────────────
const grid = document.getElementById('archiveGrid');

SECTIONS.forEach(sec => {
  const card = document.createElement('a');
  card.href = sec.href;
  card.className = 'section-card';
  card.style.setProperty('--accent-color', sec.accent);
  card.style.setProperty('--glow-color', sec.glow);

  // Particles
  const particleHTML = (sec.particles || []).map((p, i) =>
    `<div class="card-particle" style="width:3px;height:3px;bottom:30%;left:50%;--pd:${1.5+i*0.4}s;--pdl:${i*0.3}s;--px:${p.x};--py:${p.y};"></div>`
  ).join('');

  card.innerHTML = `
    <div class="card-tooltip">${sec.tooltip}</div>
    <div class="card-icon-wrap" style="border-color:${sec.accent}30;">
      ${sec.icon}
    </div>
    <div class="card-body">
      <div class="card-title">
        <span class="card-the">${sec.the}</span>
        ${sec.name}
      </div>
      <div class="card-tagline">${sec.tagline}</div>
    </div>
    <div class="card-constellation" style="color:${sec.accent};">${sec.constellation}</div>
    ${particleHTML}
  `;

  // Ripple on click
  card.addEventListener('click', function(e) {
    const rect = card.getBoundingClientRect();
    const rip = document.createElement('div');
    rip.className = 'ripple';
    rip.style.cssText = `left:${e.clientX-rect.left-20}px;top:${e.clientY-rect.top-20}px;width:40px;height:40px;`;
    card.appendChild(rip);
    setTimeout(() => rip.remove(), 700);
  });

  grid.appendChild(card);
});
</script>
