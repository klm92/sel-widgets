<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-Frame-Options" content="ALLOWALL">
<meta http-equiv="Content-Security-Policy" content="frame-ancestors *">
<title>Selenarium · Orrery Clock</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Josefin+Sans:wght@100;200;300;400&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #191919;
    color: #e8dfc8;
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }
  .stars { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
  .star { position:absolute; background:white; border-radius:50%;
    animation: twinkle var(--d) ease-in-out infinite; animation-delay: var(--delay); }
  @keyframes twinkle { 0%,100%{opacity:var(--op)} 50%{opacity:calc(var(--op)*0.12)} }

  .widget {
    position: relative; z-index: 1;
    width: 100%; max-width: 300px;
    display: flex; flex-direction: column; align-items: center;
  }

  .widget-title {
    font-size: 9px; letter-spacing: .45em; text-transform: uppercase;
    color: #6b6585; margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px; width: 100%;
  }
  .widget-title::before { content:'◈'; font-size:10px; color:#8b7fd4; }
  .widget-title::after { content:''; flex:1; height:1px; background:rgba(139,127,212,.15); }

  canvas { display:block; }

  .time-display {
    margin-top: 14px;
    text-align: center;
  }
  .time-hm {
    font-family: 'Josefin Sans', sans-serif;
    font-size: 38px;
    font-weight: 100;
    letter-spacing: 0.04em;
    color: #e8dfc8;
    line-height: 1;
  }
  .time-s {
    font-size: 16px;
    color: #6b6585;
    letter-spacing: 0.1em;
    vertical-align: super;
    margin-left: 2px;
  }
  .time-date {
    font-size: 10px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #6b6585;
    margin-top: 6px;
  }
  .time-ampm {
    font-size: 11px;
    letter-spacing: 0.3em;
    color: #4a4460;
    margin-top: 2px;
    text-transform: uppercase;
  }

  .legend {
    display: flex;
    gap: 16px;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.04);
    width: 100%;
    justify-content: center;
  }
  .legend-item {
    display: flex; align-items: center; gap: 5px;
  }
  .legend-dot {
    width: 7px; height: 7px; border-radius: 50%;
  }
  .legend-label {
    font-size: 8px; letter-spacing: 0.25em;
    text-transform: uppercase; color: #6b6585;
  }
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="widget">
  <div class="widget-title">Orrery Clock</div>
  <canvas id="clock" width="260" height="260"></canvas>
  <div class="time-display">
    <div class="time-hm"><span id="hm">00:00</span><span class="time-s" id="ss">00</span></div>
    <div class="time-date" id="dateStr"></div>
    <div class="time-ampm" id="ampm"></div>
  </div>
  <div class="legend">
    <div class="legend-item">
      <div class="legend-dot" style="background:#e8dfc8;box-shadow:0 0 5px #e8dfc880;"></div>
      <span class="legend-label">Hours</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#8b7fd4;box-shadow:0 0 5px #8b7fd480;"></div>
      <span class="legend-label">Minutes</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#c9a84c;box-shadow:0 0 5px #c9a84c80;"></div>
      <span class="legend-label">Seconds</span>
    </div>
  </div>
</div>

<script>
// Starfield
const starsEl = document.getElementById('stars');
for (let i = 0; i < 100; i++) {
  const s = document.createElement('div'); s.className = 'star';
  const sz = Math.random() * 1.6 + 0.3;
  s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:${Math.random()*6}s;--op:${0.1+Math.random()*0.4};`;
  starsEl.appendChild(s);
}

const canvas = document.getElementById('clock');
const ctx = canvas.getContext('2d');
const W = 260, H = 260, CX = W/2, CY = H/2;

// Orbit radii
const R_HR  = 52;   // hours orbit
const R_MIN = 88;   // minutes orbit
const R_SEC = 118;  // seconds orbit

// Planet sizes
const SZ_HR  = 7;
const SZ_MIN = 5;
const SZ_SEC = 3.5;

// Colors
const COL_HR  = '#e8dfc8';
const COL_MIN = '#8b7fd4';
const COL_SEC = '#c9a84c';
const COL_SUN = '#fff8e0';

// Trail dots for seconds (last N positions)
const SEC_TRAIL = 8;
let secTrail = [];

const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function toAngle(val, max) {
  // 12 o'clock = -PI/2, clockwise
  return (val / max) * Math.PI * 2 - Math.PI / 2;
}

function drawOrbit(r, color, dash) {
  ctx.beginPath();
  ctx.arc(CX, CY, r, 0, Math.PI * 2);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  if (dash) ctx.setLineDash(dash);
  else ctx.setLineDash([]);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawGlowCircle(x, y, radius, color, glowRadius, glowAlpha) {
  // Glow
  const g = ctx.createRadialGradient(x, y, 0, x, y, glowRadius);
  g.addColorStop(0, color + Math.round(glowAlpha * 255).toString(16).padStart(2,'0'));
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath();
  ctx.arc(x, y, glowRadius, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
  // Body
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  const now   = new Date();
  const hours = now.getHours();
  const mins  = now.getMinutes();
  const secs  = now.getSeconds();
  const ms    = now.getMilliseconds();

  // Smooth seconds with milliseconds
  const secSmooth = secs + ms / 1000;
  // Minutes move smoothly too
  const minSmooth = mins + secSmooth / 60;
  // Hours on 12-hour dial
  const hrSmooth  = (hours % 12) + minSmooth / 60;

  // Angles
  const aHr  = toAngle(hrSmooth,  12);
  const aMin = toAngle(minSmooth, 60);
  const aSec = toAngle(secSmooth, 60);

  // Background radial glow
  const bg = ctx.createRadialGradient(CX, CY, 0, CX, CY, 130);
  bg.addColorStop(0, 'rgba(139,127,212,0.05)');
  bg.addColorStop(0.5, 'rgba(25,25,25,0.0)');
  bg.addColorStop(1, 'rgba(25,25,25,0)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Tick marks around outer edge
  for (let i = 0; i < 60; i++) {
    const a = (i / 60) * Math.PI * 2 - Math.PI / 2;
    const isMajor = i % 5 === 0;
    const r1 = R_SEC + 10;
    const r2 = r1 + (isMajor ? 6 : 3);
    ctx.beginPath();
    ctx.moveTo(CX + r1 * Math.cos(a), CY + r1 * Math.sin(a));
    ctx.lineTo(CX + r2 * Math.cos(a), CY + r2 * Math.sin(a));
    ctx.strokeStyle = isMajor ? 'rgba(200,191,255,0.6)' : 'rgba(255,255,255,0.18)';
    ctx.lineWidth = isMajor ? 1.4 : 0.9;
    ctx.stroke();
  }

  // Hour numerals (soft, inside)
  ctx.font = '8px "Josefin Sans", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let h = 1; h <= 12; h++) {
    const a = (h / 12) * Math.PI * 2 - Math.PI / 2;
    const nr = R_SEC + 22;
    ctx.fillStyle = 'rgba(200,194,220,0.75)';
    ctx.fillText(h, CX + nr * Math.cos(a), CY + nr * Math.sin(a));
  }

  // Orbits
  drawOrbit(R_HR,  'rgba(232,223,200,0.22)',  [3, 5]);
  drawOrbit(R_MIN, 'rgba(139,127,212,0.28)',  [2, 4]);
  drawOrbit(R_SEC, 'rgba(201,168,76,0.22)',   [1, 3]);

  // Seconds trail
  const sxNow = CX + R_SEC * Math.cos(aSec);
  const syNow = CY + R_SEC * Math.sin(aSec);
  secTrail.push({ x: sxNow, y: syNow });
  if (secTrail.length > SEC_TRAIL) secTrail.shift();
  secTrail.forEach((pt, i) => {
    const alpha = (i / secTrail.length) * 0.4;
    const sz = SZ_SEC * (i / secTrail.length) * 0.8;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, Math.max(sz, 1), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(201,168,76,${alpha})`;
    ctx.fill();
  });

  // ── Sun (center) ──
  const sunG = ctx.createRadialGradient(CX, CY, 0, CX, CY, 18);
  sunG.addColorStop(0, '#fff8e8');
  sunG.addColorStop(0.4, '#f0d070');
  sunG.addColorStop(1, 'rgba(201,168,76,0)');
  ctx.beginPath();
  ctx.arc(CX, CY, 18, 0, Math.PI * 2);
  ctx.fillStyle = sunG;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(CX, CY, 9, 0, Math.PI * 2);
  ctx.fillStyle = '#fff8d0';
  ctx.fill();

  // ── Hour planet ──
  const hx = CX + R_HR * Math.cos(aHr);
  const hy = CY + R_HR * Math.sin(aHr);
  // connector line from sun
  ctx.beginPath();
  ctx.moveTo(CX, CY);
  ctx.lineTo(hx, hy);
  ctx.strokeStyle = 'rgba(232,223,200,0.08)';
  ctx.lineWidth = 1;
  ctx.stroke();
  drawGlowCircle(hx, hy, SZ_HR, COL_HR, SZ_HR * 3.5, 0.35);

  // ── Minute planet ──
  const mx = CX + R_MIN * Math.cos(aMin);
  const my = CY + R_MIN * Math.sin(aMin);
  ctx.beginPath();
  ctx.moveTo(CX, CY);
  ctx.lineTo(mx, my);
  ctx.strokeStyle = 'rgba(139,127,212,0.1)';
  ctx.lineWidth = 1;
  ctx.stroke();
  drawGlowCircle(mx, my, SZ_MIN, COL_MIN, SZ_MIN * 4, 0.3);

  // ── Second planet ──
  const sx = CX + R_SEC * Math.cos(aSec);
  const sy = CY + R_SEC * Math.sin(aSec);
  drawGlowCircle(sx, sy, SZ_SEC, COL_SEC, SZ_SEC * 5, 0.4);

  // ── Digital readout in center ──
  const h12 = hours % 12 || 12;
  const ampm = hours < 12 ? 'AM' : 'PM';
  const hStr = String(h12).padStart(2,'0');
  const mStr = String(mins).padStart(2,'0');
  const sStr = String(secs).padStart(2,'0');

  // Update DOM
  document.getElementById('hm').textContent    = hStr + ':' + mStr;
  document.getElementById('ss').textContent    = sStr;
  document.getElementById('ampm').textContent  = ampm;

  const d = now;
  document.getElementById('dateStr').textContent =
    DAYS[d.getDay()] + ' · ' + MONTHS[d.getMonth()] + ' ' + d.getDate();
}

// Run at ~60fps for smooth second hand
function loop() {
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
